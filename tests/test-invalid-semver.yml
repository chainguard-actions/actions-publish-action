name: Test invalid semver tag is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source-tag: not-a-version
      - name: Assert action failed and no major tag output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MAJOR: ${{ steps.action.outputs.major-tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "major-tag: $MAJOR"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-semver tag"
            exit 1
          fi
          if [ -n "$MAJOR" ]; then
            echo "FAIL: expected empty major-tag output"
            exit 1
          fi
          echo "PASS"
