name: Test pre-release source tag rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source-tag: v1.0.0-beta.1
      - name: Assert action failed with no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.major-tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "major-tag: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for pre-release tag"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected empty major-tag output"
            exit 1
          fi
          echo "PASS"
