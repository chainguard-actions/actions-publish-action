name: Test slack webhook notified on failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local webhook receiver
        run: |
          cat > /tmp/webhook.js <<'EOF'
          const http = require('http');
          const fs = require('fs');
          http.createServer((req, res) => {
            let body = '';
            req.on('data', c => body += c);
            req.on('end', () => {
              fs.appendFileSync('/tmp/webhook-body.txt', body + '\n');
              res.writeHead(200, {'Content-Type': 'application/json'});
              res.end('{}');
            });
          }).listen(18765, '127.0.0.1');
          EOF
          rm -f /tmp/webhook-body.txt
          nohup node /tmp/webhook.js > /tmp/webhook.log 2>&1 &
          for i in $(seq 1 20); do
            if node -e "require('net').connect(18765,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
              echo "receiver up"; exit 0
            fi
            sleep 0.5
          done
          echo "receiver failed to start"; cat /tmp/webhook.log; exit 1
      - id: action
        uses: .
        continue-on-error: true
        with:
          source-tag: invalid-tag
          slack-webhook: http://127.0.0.1:18765/hook
      - name: Assert failure and webhook message posted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if [ ! -f /tmp/webhook-body.txt ]; then
            echo "FAIL: webhook never received a request"
            exit 1
          fi
          echo "webhook body:"; cat /tmp/webhook-body.txt
          if ! grep -q "Failed to update a major tag" /tmp/webhook-body.txt; then
            echo "FAIL: expected failure message in webhook body"
            exit 1
          fi
          echo "PASS"
