name: Test slack webhook notified on failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local webhook capture server
        id: server
        run: |
          rm -f /tmp/slack-body.json
          cat > /tmp/slack-server.py <<'EOF'
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(n)
                  with open('/tmp/slack-body.json', 'wb') as f:
                      f.write(body)
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(('127.0.0.1', 18765), H).serve_forever()
          EOF
          if command -v python3 >/dev/null 2>&1; then
            nohup python3 /tmp/slack-server.py >/tmp/slack-server.log 2>&1 &
            sleep 2
            if curl -s -o /dev/null -X POST -d '{}' http://127.0.0.1:18765/probe; then
              rm -f /tmp/slack-body.json
              echo "started=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "started=false" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          source-tag: not-a-version
          slack-webhook: http://127.0.0.1:18765/hook
      - name: Assert action failed and posted failure message to Slack webhook
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.major-tag }}
          STARTED: ${{ steps.server.outputs.started }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          echo "server started: $STARTED"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid semver tag"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: major-tag should not be set"
            exit 1
          fi
          if [ "$STARTED" = "true" ]; then
            if [ ! -f /tmp/slack-body.json ]; then
              echo "FAIL: webhook was not called"
              exit 1
            fi
            BODY="$(cat /tmp/slack-body.json)"
            echo "webhook body: $BODY"
            if ! echo "$BODY" | grep -q "Failed to update a major tag"; then
              echo "FAIL: unexpected webhook message"
              exit 1
            fi
          else
            echo "NOTE: capture server unavailable; only outcome verified"
          fi
          echo "PASS"
