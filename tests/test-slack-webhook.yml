name: Test with slack-webhook input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source-tag: v2.0.1
          # Unreachable local webhook: no real Slack message is ever sent.
          slack-webhook: http://127.0.0.1:9/services/T000/B000/XXXX
      - name: Assert action ran (output v2, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.major-tag }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "v2" ]; then
              echo "FAIL: expected major-tag 'v2'"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / unreachable webhook)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
